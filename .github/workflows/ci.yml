name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - codex/storyboard-generator

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record check environment
        run: |
          mkdir -p "$RUNNER_TEMP/storyboard-ci-diagnostics"
          git rev-parse HEAD > "$RUNNER_TEMP/storyboard-ci-diagnostics/checkout-sha.txt"
          node --version > "$RUNNER_TEMP/storyboard-ci-diagnostics/node-version.txt"
          npm --version > "$RUNNER_TEMP/storyboard-ci-diagnostics/npm-version.txt"
          node -e 'console.log(JSON.stringify({platform:process.platform,arch:process.arch,imageOS:process.env.ImageOS??null,imageVersion:process.env.ImageVersion??null}))' > "$RUNNER_TEMP/storyboard-ci-diagnostics/runner-environment.json"
          sha256sum .github/workflows/ci.yml package-lock.json vitest.config.ts > "$RUNNER_TEMP/storyboard-ci-diagnostics/input-hashes.txt"
      - run: npm run check
        env:
          STORYBOARD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          STORYBOARD_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/storyboard-ci-diagnostics
      - name: Retain failed check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-check-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/storyboard-ci-diagnostics
            .build/build-manifest.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:e2e
      - run: npm run test:e2e -- tests/e2e/real-audio.spec.ts --repeat-each=3
